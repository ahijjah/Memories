name: memory-app-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memory-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory_app
      POSTGRES_PASSWORD: memory_app_dev_password
      POSTGRES_DB: memory_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_app -d memory_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memory-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
