# Reverse proxy for the Memory App API.
# Replace SUBDOMAIN.YOURDOMAIN.COM with your actual subdomain before use.
# This file only touches this one subdomain's traffic — it does not
# interact with any other server blocks / apps already on this VPS.

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMAIN.YOURDOMAIN.COM;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# After this file is in place and DNS has propagated, run:
#   sudo certbot --nginx -d SUBDOMAIN.YOURDOMAIN.COM
# Certbot will rewrite this file to add the 443/SSL block and redirect
# automatically — you don't need to write that part by hand.
